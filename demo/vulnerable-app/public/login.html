<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in - CampusKart</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0b1021; color: #e2e8f0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 18px; }
  .banner { position: relative; width: 920px; height: 420px; border: 5px solid #f59e0b; overflow: hidden; }
  .decoration { position: absolute; width: 320px; height: 320px; background: #f59e0b; border-radius: 50%; animation: drift 7s ease-in-out infinite; left: 50px; top: 50px; }
  @keyframes drift {
    0% { left: 50px; top: 50px; }
    20% { left: 500px; top: 120px; }
    40% { left: 120px; top: 300px; }
    60% { left: 560px; top: 260px; }
    80% { left: 200px; top: 80px; }
    100% { left: 50px; top: 50px; }
  }
  form { background: #1e293b; padding: 26px; border-radius: 8px; border: 1px solid #334155; width: 340px; }
  h2 { margin-bottom: 18px; text-align: center; font-size: 22px; }
  label { display: block; margin: 11px 0 6px; font-size: 14px; color: #cbd5e1; }
  input { width: 100%; padding: 9px; margin-bottom: 10px; border: 1px solid #475569; border-radius: 4px; background: #0f172a; color: #e2e8f0; }
  button { width: 100%; padding: 11px; background: #f59e0b; border: none; border-radius: 4px; color: #0b1021; font-weight: 700; cursor: pointer; font-size: 16px; }
  button:hover { background: #d97706; }
  #msg { margin-top: 14px; font-size: 14px; min-height: 22px; text-align: center; }
</style>
</head>
<body>
  <div class="banner"><div class="decoration"></div></div>
  <form id="login">
    <h2>Sign in</h2>
    <label for="email">Campus email</label>
    <input type="email" id="email" name="email" required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>
    <button type="submit">Sign in</button>
    <div id="msg"></div>
  </form>
<script>
(function () {
  'use strict';

  var form = document.getElementById('login');
  var emailInput = document.getElementById('email');
  var passwordInput = document.getElementById('password');
  var msg = document.getElementById('msg');
  var btn = form.querySelector('button');

  function setMessage(text, kind) {
    msg.textContent = text;
    msg.style.color = kind === 'error' ? '#f87171' : '#4ade80';
  }

  function clearMessage() {
    msg.textContent = '';
  }

  function isCampusEmail(value) {
    return typeof value === 'string' && value.endsWith('@campus.edu');
  }

  function isLongEnough(value) {
    return typeof value === 'string' && value.length >= 6;
  }

  function validateInputs(email, password) {
    if (!email || !password) {
      return 'Fill in both fields.';
    }
    if (!isCampusEmail(email)) {
      return 'Use your campus email address.';
    }
    if (!isLongEnough(password)) {
      return 'Password must be at least 6 characters.';
    }
    return null;
  }

  function busy() {
    btn.disabled = true;
    btn.textContent = 'Signing in...';
  }

  function idle() {
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }

  async function handleSubmit(event) {
    event.preventDefault();
    clearMessage();
    var email = emailInput.value.trim();
    var password = passwordInput.value;
    var problem = validateInputs(email, password);
    if (problem) {
      setMessage(problem, 'error');
      return;
    }
    busy();
    try {
      var response = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      });
      var payload = await response.json().catch(function () { return {}; });
      if (response.ok) {
        setMessage('Welcome, ' + (payload.user && payload.user.name ? payload.user.name : 'there') + '!', 'ok');
        setTimeout(function () { window.location.href = '/'; }, 1200);
      } else {
        setMessage('Invalid email or password.', 'error');
      }
    } catch (err) {
      setMessage('Could not reach the server.', 'error');
    } finally {
      idle();
    }
  }

  form.addEventListener('submit', handleSubmit);
  emailInput.addEventListener('focus', clearMessage);

      item.textContent = step.id + '. ' + step.title + ' — ' + step.text;

  }
