AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  Siidekick: security scanning for small Indian web teams. CloudFront + S3 serve the site;
  API Gateway + Lambda + DynamoDB run scans; Amazon Bedrock explains findings in Indian languages;
  Step Functions + CodeBuild verify approved fixes in a throwaway build; CloudWatch watches it all.
  Sized for the AWS Free Tier at demo traffic.

Parameters:
  ExistingRoleArn:
    Type: String
    Default: ""
    Description: >
      Leave empty on a normal AWS (Free Tier) account: the stack creates least-privilege roles.
      Only set it on an AWS Learner Lab account, which cannot create roles, e.g.
      arn:aws:iam::<account-id>:role/LabRole.
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: >
      Bedrock model (in-region) or inference profile for explanations. Amazon Nova is first-party, so it runs on
      Free Plan credits without a Marketplace subscription. Free Plan accounts are limited to one region,
      so the default calls the model in the stack region, never routing elsewhere.
  BedrockRegion:
    Type: String
    Default: ""
    Description: Region for Bedrock calls; empty means the stack's region.
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional. Email that receives CloudWatch alarm notifications (confirm the subscription mail).

Conditions:
  UseExistingRole: !Not [!Equals [!Ref ExistingRoleArn, ""]]
  CreateRoles: !Equals [!Ref ExistingRoleArn, ""]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  HasBedrockRegion: !Not [!Equals [!Ref BedrockRegion, ""]]

Resources:
  # ==================================================================
  # Records and artefacts
  # ==================================================================
  ScansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: siidekick-scans
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Build inputs (before/after zips), raw build output and verdicts. Encrypted, private, expire after 7 days.
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "siidekick-artifacts-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-jobs
            Status: Enabled
            Prefix: jobs/
            ExpirationInDays: 7

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ==================================================================
  # API: API Gateway HTTP API -> Lambda
  # ==================================================================
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: siidekick-api
      Description: Siidekick scanning API
      # Scans are unauthenticated; cap request rate so nobody can run up the bill.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 5
      # No CORS: the browser reaches the API through the same CloudFront domain as the site.

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/siidekick-api
      RetentionInDays: 14

  ApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: siidekick-api
      Description: Siidekick HTTP API
      CodeUri: ../apps/api/dist
      Handler: lambda.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      # The demo attack replay boots two copies of the shop as child processes.
      MemorySize: 1024
      # API Gateway HTTP API stops waiting at 30 s.
      Timeout: 29
      Environment:
        Variables:
          STORAGE: dynamo
          TABLE_NAME: !Ref ScansTable
          ARTIFACT_BUCKET: !Ref ArtifactBucket
          STATE_MACHINE_ARN: !Ref VerifyStateMachine
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_REGION: !If [HasBedrockRegion, !Ref BedrockRegion, !Ref AWS::Region]
      Role: !If [UseExistingRole, !Ref ExistingRoleArn, !GetAtt ApiRole.Arn]
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi

  # ==================================================================
  # Verified fixes: Step Functions -> CodeBuild -> Lambda (evaluate)
  # ==================================================================
  EvaluateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/siidekick-evaluate
      RetentionInDays: 14

  EvaluateFunction:
    Type: AWS::Serverless::Function
    DependsOn: EvaluateLogGroup
    Properties:
      FunctionName: siidekick-evaluate
      Description: Applies the trust rule to a CodeBuild verification run
      CodeUri: ../apps/api/dist
      Handler: lambda.evaluateHandler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          STORAGE: dynamo
          TABLE_NAME: !Ref ScansTable
          ARTIFACT_BUCKET: !Ref ArtifactBucket
      Role: !If [UseExistingRole, !Ref ExistingRoleArn, !GetAtt EvaluateRole.Arn]

  VerifyBuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /siidekick/codebuild
      RetentionInDays: 14

  # The build runs code from scanned repositories, which is untrusted. This role can read the job's
  # source zip, write the job's output and write logs: nothing else in the account.
  VerifyBuildRole:
    Type: AWS::IAM::Role
    Condition: CreateRoles
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: siidekick-verify-build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${VerifyBuildLogGroup.Arn}:*"
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
                Resource: !Sub "${ArtifactBucket.Arn}/jobs/*"
              - Effect: Allow
                Action: [s3:GetBucketAcl, s3:GetBucketLocation]
                Resource: !GetAtt ArtifactBucket.Arn

  VerifyProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: siidekick-verify
      Description: Throwaway build that installs, tests and audits a repo before and after Siidekick's fixes
      ServiceRole: !If [UseExistingRole, !Ref ExistingRoleArn, !GetAtt VerifyBuildRole.Arn]
      # CPU, memory, time and concurrency limits (project brief §6).
      TimeoutInMinutes: 15
      QueuedTimeoutInMinutes: 15
      ConcurrentBuildLimit: 2
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        PrivilegedMode: false
      # Each run overrides the location with its own jobs/<id>/source.zip.
      Source:
        Type: S3
        Location: !Sub "${ArtifactBucket}/jobs/none/source.zip"
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                nodejs: 22
            build:
              commands:
                - bash siidekick/verify.sh
          artifacts:
            base-directory: out
            files:
              - '**/*'
      Artifacts:
        Type: S3
        Location: !Ref ArtifactBucket
        Path: jobs
        Name: out
        Packaging: NONE
        NamespaceType: NONE
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref VerifyBuildLogGroup
        S3Logs:
          Status: DISABLED

  VerifyStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: siidekick-verify
      Type: STANDARD
      Role: !If [UseExistingRole, !Ref ExistingRoleArn, !GetAtt StateMachineRole.Arn]
      DefinitionSubstitutions:
        ProjectName: !Ref VerifyProject
        Bucket: !Ref ArtifactBucket
        EvaluateArn: !GetAtt EvaluateFunction.Arn
      Definition:
        Comment: "Verify approved fixes: build and test before/after in CodeBuild, then apply the trust rule."
        StartAt: IsolatedBuild
        States:
          IsolatedBuild:
            Type: Task
            Comment: npm install, npm test and npm audit on the original and the fixed copy
            Resource: arn:aws:states:::codebuild:startBuild.sync
            TimeoutSeconds: 1200
            Parameters:
              ProjectName: ${ProjectName}
              SourceLocationOverride.$: "States.Format('${Bucket}/jobs/{}/source.zip', $.jobId)"
              ArtifactsOverride:
                Type: S3
                Location: ${Bucket}
                Path.$: "States.Format('jobs/{}', $.jobId)"
                Name: out
                Packaging: NONE
                NamespaceType: NONE
            ResultSelector:
              status.$: $.Build.BuildStatus
            ResultPath: $.build
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.error
                Next: Evaluate
            Next: Evaluate
          Evaluate:
            Type: Task
            Comment: Trust rule. Verified only if tests pass and npm audit no longer reports the targeted packages.
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${EvaluateArn}
              Payload.$: $
            OutputPath: $.Payload
            Retry:
              - ErrorEquals: [Lambda.ServiceException, Lambda.TooManyRequestsException, Lambda.SdkClientException]
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2
            End: true

  # ==================================================================
  # Static site: S3 (private) behind CloudFront, /api/* routed to the HTTP API
  # ==================================================================
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "siidekick-web-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "siidekick-s3-oac-${AWS::Region}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Join ["", [!GetAtt WebBucket.Arn, "/*"]]
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "siidekick-spa-rewrite-${AWS::Region}"
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for app routes like /app (paths without a file extension)
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          var last = req.uri.split("/").pop();
          if (last.indexOf(".") === -1) req.uri = "/index.html";
          return req;
        }

  # Security headers on every site response (the scanner checks other people's sites for these, so ours sends them).
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "siidekick-security-headers-${AWS::Region}"
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
            Override: true

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Siidekick static site and API
        Enabled: true
        HttpVersion: http2and3
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: ApiOrigin
            DomainName: !Sub "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
              OriginReadTimeout: 30
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        # No CustomErrorResponses: they would also rewrite real API 403/404s into index.html with a 200.

  # ==================================================================
  # IAM: one least-privilege role per component (skipped on Learner Lab, which passes ExistingRoleArn).
  # Explicit roles, because SAM cannot switch a function's Policies on a condition.
  # ==================================================================
  ApiRole:
    Type: AWS::IAM::Role
    Condition: CreateRoles
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: siidekick-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${ApiLogGroup.Arn}:*"
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:DeleteItem]
                Resource: !GetAtt ScansTable.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "${ArtifactBucket.Arn}/jobs/*"
              # Without ListBucket, S3 answers 403 instead of 404 for a job file that does not exist yet.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ArtifactBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: "jobs/*"
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:siidekick-verify"
              - Effect: Allow
                Action: states:DescribeExecution
                Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:siidekick-verify:*"
              # Region-wildcarded so an inference profile (which routes between regions) also works if configured.
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/amazon.nova-*"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"

  EvaluateRole:
    Type: AWS::IAM::Role
    Condition: CreateRoles
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: siidekick-evaluate
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${EvaluateLogGroup.Arn}:*"
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "${ArtifactBucket.Arn}/jobs/*"
              # Without ListBucket, S3 answers 403 instead of 404 for a job file that does not exist yet.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ArtifactBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: "jobs/*"

  StateMachineRole:
    Type: AWS::IAM::Role
    Condition: CreateRoles
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "states.${AWS::Region}.amazonaws.com"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: siidekick-verify-workflow
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [codebuild:StartBuild, codebuild:StopBuild, codebuild:BatchGetBuilds, codebuild:BatchGetReports]
                Resource: !GetAtt VerifyProject.Arn
              - Effect: Allow
                Action: [events:PutTargets, events:PutRule, events:DescribeRule]
                Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventForCodeBuildStartBuildRule"
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt EvaluateFunction.Arn

  # ==================================================================
  # CloudWatch: alarms and one dashboard for the whole pipeline
  # ==================================================================
  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      TopicName: siidekick-alarms
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: siidekick-api-errors
      AlarmDescription: The API Lambda threw errors (5 or more in 5 minutes).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]

  VerifyFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: siidekick-verify-failures
      AlarmDescription: A verification workflow failed or timed out (infrastructure problem, not a failing test).
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref VerifyStateMachine
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: siidekick
      DashboardBody: !Sub
        - |
          {
            "widgets": [
              {"type": "text", "x": 0, "y": 0, "width": 24, "height": 2,
               "properties": {"markdown": "## Siidekick\nScans (Lambda) → AI explanations (Bedrock) → verified fixes (Step Functions + CodeBuild). Audit events: Logs Insights on /aws/lambda/siidekick-api, filter `audit`."}},
              {"type": "metric", "x": 0, "y": 2, "width": 8, "height": 6,
               "properties": {"title": "API requests and errors", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [["AWS/Lambda", "Invocations", "FunctionName", "${ApiFunction}"], [".", "Errors", ".", "."]]}},
              {"type": "metric", "x": 8, "y": 2, "width": 8, "height": 6,
               "properties": {"title": "API latency (p50 / p95 ms)", "region": "${AWS::Region}", "period": 300,
                "metrics": [["AWS/Lambda", "Duration", "FunctionName", "${ApiFunction}", {"stat": "p50"}], ["...", {"stat": "p95"}]]}},
              {"type": "metric", "x": 16, "y": 2, "width": 8, "height": 6,
               "properties": {"title": "Bedrock calls", "region": "${BedrockMetricRegion}", "stat": "Sum", "period": 300,
                "metrics": [["AWS/Bedrock", "Invocations"], [".", "InvocationClientErrors"], [".", "InvocationServerErrors"]]}},
              {"type": "metric", "x": 0, "y": 8, "width": 8, "height": 6,
               "properties": {"title": "Verification workflows", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [["AWS/States", "ExecutionsStarted", "StateMachineArn", "${VerifyStateMachine}"], [".", "ExecutionsSucceeded", ".", "."], [".", "ExecutionsFailed", ".", "."]]}},
              {"type": "metric", "x": 8, "y": 8, "width": 8, "height": 6,
               "properties": {"title": "CodeBuild runs", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [["AWS/CodeBuild", "Builds", "ProjectName", "${VerifyProject}"], [".", "SucceededBuilds", ".", "."], [".", "FailedBuilds", ".", "."]]}},
              {"type": "metric", "x": 16, "y": 8, "width": 8, "height": 6,
               "properties": {"title": "CodeBuild duration (s)", "region": "${AWS::Region}", "stat": "Average", "period": 300,
                "metrics": [["AWS/CodeBuild", "Duration", "ProjectName", "${VerifyProject}"]]}},
              {"type": "log", "x": 0, "y": 14, "width": 24, "height": 6,
               "properties": {"title": "Audit trail (latest)", "region": "${AWS::Region}",
                "query": "SOURCE '/aws/lambda/siidekick-api' | SOURCE '/aws/lambda/siidekick-evaluate' | fields @timestamp, audit, scanId, jobId, status, checkId, lang | filter ispresent(audit) | sort @timestamp desc | limit 50", "view": "table"}}
            ]
          }
        - BedrockMetricRegion: !If [HasBedrockRegion, !Ref BedrockRegion, !Ref AWS::Region]

Outputs:
  SiteUrl:
    Description: CloudFront site URL
    Value: !GetAtt CloudFrontDistribution.DomainName
  ApiUrl:
    Description: API Gateway HTTP API endpoint (the site calls it through CloudFront at /api)
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  BucketName:
    Description: S3 bucket for the web build
    Value: !Ref WebBucket
  DistributionId:
    Description: CloudFront distribution id (for cache invalidation after a web deploy)
    Value: !Ref CloudFrontDistribution
  ArtifactBucketName:
    Description: S3 bucket for verification jobs (expire after 7 days)
    Value: !Ref ArtifactBucket
  StateMachineArn:
    Description: Step Functions workflow that verifies fixes
    Value: !Ref VerifyStateMachine
  DashboardUrl:
    Description: CloudWatch dashboard
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/siidekick"
